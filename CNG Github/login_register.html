<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register | CNG Booking System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      padding: 2rem 1rem;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .auth-card h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    .toggle-link {
      margin-top: 1.5rem;
      display: block;
      color: var(--primary);
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      text-decoration: underline;
      transition: var(--transition);
    }

    .toggle-link:hover {
      color: var(--primary-dark);
    }

    /* Password toggle input container */
    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .password-wrapper input {
      padding-right: 3rem;
    }

    .toggle-password-btn {
      position: absolute;
      right: 1rem;
      top: 35%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--primary);
      font-size: 1.1rem;
      user-select: none;
      background: none;
      border: none;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-color);
      transition: var(--transition);
    }

    .step-dot.active {
      background: var(--primary);
      transform: scale(1.2);
    }
  </style>
</head>

<body>
  <header>
    <!-- Injected dynamically by header.js -->
  </header>

  <div class="auth-container">
    <div class="auth-card" id="authCard">
      <h2 id="formTitle">Login</h2>

      <!-- Multi-step dynamic form -->
      <form id="authForm" novalidate>

        <!-- Registration Fields (Step 1: Account Info) -->
        <div id="registerFieldsStep1" style="display:none;">
          <div class="step-indicator">
            <span class="step-dot active"></span>
            <span class="step-dot"></span>
          </div>

          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">

          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" placeholder="name@domain.com">

          <label for="contact">Contact Number:</label>
          <input type="tel" id="contact" name="contact" placeholder="10-digit mobile number">

          <button type="button" class="btn" id="nextStepBtn" style="width: 100%;">Next: Vehicle Info &rarr;</button>
        </div>

        <!-- Registration Fields (Step 2: Vehicle & Credentials) -->
        <div id="registerFieldsStep2" style="display:none;">
          <div class="step-indicator">
            <span class="step-dot"></span>
            <span class="step-dot active"></span>
          </div>

          <label for="vehicleno">Vehicle Number (Registration plate):</label>
          <input type="text" id="vehicleno" name="vehicleno" placeholder="e.g. TS09EA1234">

          <label for="regUsername">Choose Username:</label>
          <input type="text" id="regUsername" name="regUsername" placeholder="e.g. saikiran">

          <label for="regPassword">Password:</label>
          <div class="password-wrapper">
            <input type="password" id="regPassword" name="regPassword" placeholder="Minimum 6 characters">
            <span class="toggle-password-btn" onclick="togglePassword('regPassword')">👁</span>
          </div>

          <div style="display: flex; gap: 10px; margin-top: 1rem;">
            <button type="button" class="btn btn-secondary" id="backStepBtn" style="flex: 1;">&larr; Back</button>
            <button type="submit" class="btn" style="flex: 2;">Register Account</button>
          </div>
        </div>

        <!-- Login Fields -->
        <div id="loginFields">
          <label for="username">Username or Email:</label>
          <input type="text" id="username" name="username" placeholder="Enter username/email" required>

          <label for="password">Password:</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter password" required>
            <span class="toggle-password-btn" onclick="togglePassword('password')">👁</span>
          </div>

          <button type="submit" class="btn" id="submitBtn" style="width: 100%; margin-top: 1rem;">Login</button>
        </div>

      </form>

      <span class="toggle-link" id="toggleLink">New user? Register here</span>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 CNG Booking System | Designed by K.Sai Mahesh</p>
  </footer>

  <script src="db.js"></script>
  <script src="header.js"></script>
  <script>
    const toggleLink = document.getElementById("toggleLink");
    const formTitle = document.getElementById("formTitle");
    const loginFields = document.getElementById("loginFields");
    const registerFieldsStep1 = document.getElementById("registerFieldsStep1");
    const registerFieldsStep2 = document.getElementById("registerFieldsStep2");
    const authForm = document.getElementById("authForm");

    const nextStepBtn = document.getElementById("nextStepBtn");
    const backStepBtn = document.getElementById("backStepBtn");

    let isRegister = false;

    // Dynamically manage required attributes to avoid blocking validations on hidden inputs
    function updateRequiredFields() {
      const loginUser = document.getElementById("username");
      const loginPass = document.getElementById("password");
      const regFullname = document.getElementById("fullname");
      const regEmail = document.getElementById("email");
      const regContact = document.getElementById("contact");
      const regVehicleno = document.getElementById("vehicleno");
      const regUser = document.getElementById("regUsername");
      const regPass = document.getElementById("regPassword");

      if (isRegister) {
        loginUser.removeAttribute("required");
        loginPass.removeAttribute("required");
        regFullname.setAttribute("required", "");
        regEmail.setAttribute("required", "");
        regContact.setAttribute("required", "");
        regVehicleno.setAttribute("required", "");
        regUser.setAttribute("required", "");
        regPass.setAttribute("required", "");
      } else {
        loginUser.setAttribute("required", "");
        loginPass.setAttribute("required", "");
        regFullname.removeAttribute("required");
        regEmail.removeAttribute("required");
        regContact.removeAttribute("required");
        regVehicleno.removeAttribute("required");
        regUser.removeAttribute("required");
        regPass.removeAttribute("required");
      }
    }

    // Initialize required state on load
    updateRequiredFields();

    // Toggle between Login & Register forms
    toggleLink.addEventListener("click", () => {
      isRegister = !isRegister;
      resetValidation();
      authForm.reset();
      updateRequiredFields();

      if (isRegister) {
        formTitle.textContent = "Register Account";
        loginFields.style.display = "none";
        registerFieldsStep1.style.display = "block";
        registerFieldsStep2.style.display = "none";
        toggleLink.textContent = "Already have an account? Login here";
      } else {
        formTitle.textContent = "Login";
        loginFields.style.display = "block";
        registerFieldsStep1.style.display = "none";
        registerFieldsStep2.style.display = "none";
        toggleLink.textContent = "New user? Register here";
      }
    });

    // Multi-step Registration Next/Back handlers
    nextStepBtn.addEventListener("click", () => {
      const name = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim();
      const contact = document.getElementById("contact").value.trim();

      if (!name) {
        showError("fullname", "Full Name is required.");
        return;
      }
      clearError("fullname");

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        showError("email", "Please enter a valid email address.");
        return;
      }
      clearError("email");

      const phoneRegex = /^[0-9]{10}$/;
      if (!contact || !phoneRegex.test(contact)) {
        showError("contact", "Please enter a valid 10-digit mobile number.");
        return;
      }
      clearError("contact");

      // Slide to step 2
      registerFieldsStep1.style.display = "none";
      registerFieldsStep2.style.display = "block";
    });

    backStepBtn.addEventListener("click", () => {
      registerFieldsStep2.style.display = "none";
      registerFieldsStep1.style.display = "block";
    });

    // Form Submission
    authForm.addEventListener("submit", (e) => {
      e.preventDefault();

      if (isRegister) {
        const vehicleno = document.getElementById("vehicleno").value.trim().toUpperCase();
        const username = document.getElementById("regUsername").value.trim();
        const password = document.getElementById("regPassword").value.trim();

        const vehicleRegex = /^[A-Z]{2}[0-9]{2}[A-Z]{1,2}[0-9]{4}$/;
        if (!vehicleno) {
          showError("vehicleno", "Vehicle Registration Number is required.");
          return;
        }
        clearError("vehicleno");

        if (!username || username.length < 3) {
          showError("regUsername", "Username must be at least 3 characters.");
          return;
        }
        clearError("regUsername");

        if (!password || password.length < 6) {
          showError("regPassword", "Password must be at least 6 characters.");
          return;
        }
        clearError("regPassword");

        const fullname = document.getElementById("fullname").value.trim();
        const email = document.getElementById("email").value.trim();
        const contact = document.getElementById("contact").value.trim();

        // Register in localStorage db
        const result = window.CNG_DB.register(fullname, email, contact, vehicleno, username, password);
        if (result.success) {
          window.showNotification("✅ Registration Successful!", `Welcome, ${fullname}! You have been registered and logged in successfully.`, () => {
            // Check if there was a selected pump in mapping flow
            if (window.CNG_DB.getSelectedPump()) {
              window.location.href = "booking.html";
            } else {
              window.location.href = "details.html";
            }
          });
        } else {
          window.showNotification("Registration Failed", result.message);
        }

      } else {
        // Login Flow
        const usernameOrEmail = document.getElementById("username").value.trim();
        const passwordVal = document.getElementById("password").value;

        if (!usernameOrEmail) {
          showError("username", "Please enter your Username or Email.");
          return;
        }
        clearError("username");

        if (!passwordVal) {
          showError("password", "Please enter your password.");
          return;
        }
        clearError("password");

        const result = window.CNG_DB.login(usernameOrEmail, passwordVal);
        if (result.success) {
          window.showNotification("✅ Login Successful", `Welcome back, ${result.user.fullname}!`, () => {
            if (window.CNG_DB.getSelectedPump()) {
              window.location.href = "booking.html";
            } else {
              window.location.href = "details.html";
            }
          });
        } else {
          window.showNotification("Login Failed", result.message);
        }
      }
    });

    // Password visibility toggle
    window.togglePassword = function (fieldId) {
      const field = document.getElementById(fieldId);
      if (field) {
        field.type = field.type === "password" ? "text" : "password";
      }
    };

    // Helper functions for inline validation error styling
    function showError(inputId, msg) {
      const input = document.getElementById(inputId);
      input.style.borderColor = "#dc3545";
      input.style.boxShadow = "0 0 0 3px rgba(220, 53, 69, 0.15)";

      let errorLabel = input.nextElementSibling;
      if (!errorLabel || !errorLabel.classList.contains("validation-error")) {
        errorLabel = document.createElement("span");
        errorLabel.className = "validation-error";
        errorLabel.style.color = "#dc3545";
        errorLabel.style.fontSize = "0.8rem";
        errorLabel.style.fontWeight = "bold";
        errorLabel.style.display = "block";
        errorLabel.style.marginTop = "-1rem";
        errorLabel.style.marginBottom = "1rem";
        input.parentNode.insertBefore(errorLabel, input.nextSibling);
      }
      errorLabel.textContent = "⚠️ " + msg;
    }

    function clearError(inputId) {
      const input = document.getElementById(inputId);
      input.style.borderColor = "";
      input.style.boxShadow = "";
      const errorLabel = input.nextElementSibling;
      if (errorLabel && errorLabel.classList.contains("validation-error")) {
        errorLabel.remove();
      }
    }

    function resetValidation() {
      const inputs = authForm.querySelectorAll("input");
      inputs.forEach(input => {
        input.style.borderColor = "";
        input.style.boxShadow = "";
        const errorLabel = input.nextElementSibling;
        if (errorLabel && errorLabel.classList.contains("validation-error")) {
          errorLabel.remove();
        }
      });
    }
  </script>
</body>

</html>
