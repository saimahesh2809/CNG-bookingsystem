<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petrol Pump Locator | CNG Booking System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .locator-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 120px);
      min-height: 500px;
    }

    #map {
      flex: 2;
      height: 100%;
      min-height: 500px;
      z-index: 1;
      border-right: 1px solid var(--border-color);
    }

    .sidebar {
      flex: 1;
      background: var(--card-bg);
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      border-left: 1px solid var(--border-color);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .search-box {
      margin-bottom: 0.5rem;
    }

    .filter-options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: var(--primary-light);
      padding: 1rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
    }

    .filter-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--primary-dark);
      cursor: pointer;
    }

    .filter-options input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
    }

    .filter-options select {
      margin-bottom: 0;
      padding: 0.5rem;
    }

    .pump-list-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .pump-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
    }

    .pump-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }

    .pump-card.selected {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }

    .pump-card h4 {
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }

    .pump-card p {
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      color: var(--text-color);
      opacity: 0.85;
    }

    .pump-card .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.8rem;
    }

    /* Marker Custom styling */
    .custom-marker {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .marker-pin {
      width: 32px;
      height: 32px;
      border-radius: 50% 50% 50% 0;
      background: var(--primary);
      position: absolute;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      margin: -16px 0 0 -16px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid white;
    }

    .marker-pin::after {
      content: '⛽';
      transform: rotate(45deg);
      font-size: 14px;
    }

    .marker-pin.closed {
      background: #dc3545;
    }

    .marker-pin.user {
      background: #007bff;
    }

    .marker-pin.user::after {
      content: '📍';
    }

    @media (max-width: 768px) {
      .locator-layout {
        flex-direction: column;
        height: auto;
      }

      #map {
        height: 350px;
        flex: none;
      }

      .sidebar {
        height: auto;
        max-height: 500px;
      }
    }
  </style>
</head>

<body>
  <header>
    <!-- Injected dynamically by header.js -->
  </header>

  <div class="locator-layout">
    <!-- Interactive Leaflet Map -->
    <div id="map" style="height: 100%; min-height: 500px;"></div>

    <!-- Locator Sidebar -->
    <div class="sidebar">
      <div class="search-box">
        <label for="searchBox">Search Location:</label>
        <input type="text" id="searchBox" placeholder="Search pump by name or address...">
      </div>

      <div class="filter-options">
        <label>
          <input type="checkbox" id="availableToggle">
          Show only available pumps
        </label>
        <label style="flex-direction: column; align-items: flex-start; gap: 4px;">
          <span>Sort Petrol Pumps:</span>
          <select id="sortOption">
            <option value="default">Default List</option>
            <option value="queue">Shortest Queue</option>
            <option value="price">Lowest CNG Price</option>
            <option value="distance">Nearest Distance</option>
          </select>
        </label>
      </div>

      <div class="pump-list-container" id="pumpList">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 CNG Booking System | Designed by K.Sai Mahesh</p>
  </footer>

  <script src="db.js"></script>
  <script src="header.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let userLat = 17.4375;
    let userLng = 78.4483; // Default near Ameerpet, Hyderabad
    let map, userMarker;
    let markersList = [];
    let activeCardId = null;

    document.addEventListener("DOMContentLoaded", () => {
      // Initialize map
      map = L.map("map").setView([userLat, userLng], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      // Render pumps immediately so the map and sidebar lists are never blank on load
      updateLocator();

      // Setup ResizeObserver to listen for any DOM layout/casing size updates on the map container
      if (window.ResizeObserver) {
        const resizeObserver = new ResizeObserver(() => {
          if (map) {
            map.invalidateSize();
          }
        });
        resizeObserver.observe(document.getElementById("map"));
      }

      // Force recalculating map size on load to fix the hidden/grey map full screen rendering bug
      setTimeout(() => {
        map.invalidateSize();
      }, 300);

      window.addEventListener("load", () => {
        map.invalidateSize();
      });

      // Try Geolocation asynchronously in the background
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;

          // User location Pin
          const userIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div class="marker-pin user"></div>',
            iconSize: [30, 42],
            iconAnchor: [15, 42]
          });

          if (userMarker) {
            map.removeLayer(userMarker);
          }
          userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map)
            .bindPopup("<strong>📍 You are here</strong>").openPopup();

          map.setView([userLat, userLng], 12);

          // Re-update locator with correct distances and markers
          updateLocator(true);
        }, (err) => {
          console.warn("Geolocation failed or was denied:", err);
        }, { timeout: 5000 });
      }

      // Add inputs event listeners
      document.getElementById("searchBox").addEventListener("input", () => updateLocator(true));
      document.getElementById("availableToggle").addEventListener("change", () => updateLocator(true));
      document.getElementById("sortOption").addEventListener("change", () => updateLocator(true));

      // Listen for background state database modifications to keep values fresh
      setInterval(() => {
        updateLocator(false); // update data but don't reset map focus/popup
      }, 5000);
    });

    // Haversine distance formula
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateLocator(resetPopup = true) {
      if (!window.CNG_DB || !map) return;

      const filterText = document.getElementById("searchBox").value.toLowerCase();
      const onlyAvailable = document.getElementById("availableToggle").checked;
      const sortBy = document.getElementById("sortOption").value;
      const loggedInUser = window.CNG_DB.getLoggedInUser();

      // Retrieve pumps data from database layer
      let pumps = window.CNG_DB.getPumps();

      // Filter
      let filtered = pumps.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(filterText) || p.address.toLowerCase().includes(filterText);
        const matchesAvail = !onlyAvailable || p.available;
        return matchesSearch && matchesAvail;
      });

      // Sort
      if (sortBy === "queue") {
        filtered.sort((a, b) => a.queue - b.queue);
      } else if (sortBy === "price") {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortBy === "distance") {
        filtered.sort((a, b) => getDistance(userLat, userLng, a.lat, a.lng) - getDistance(userLat, userLng, b.lat, b.lng));
      }

      // Sync map markers
      if (resetPopup) {
        markersList.forEach(m => map.removeLayer(m));
        markersList = [];
      }

      const listContainer = document.getElementById("pumpList");
      listContainer.innerHTML = "";

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p style="text-align: center; color:#777; margin-top:2rem;">No pumps found matching filters.</p>`;
        return;
      }

      filtered.forEach(pump => {
        const dist = getDistance(userLat, userLng, pump.lat, pump.lng).toFixed(2);

        // Add Marker
        if (resetPopup) {
          const markerClass = pump.available ? "marker-pin" : "marker-pin closed";
          const pumpIcon = L.divIcon({
            className: 'custom-marker',
            html: `<div class="${markerClass}"></div>`,
            iconSize: [30, 42],
            iconAnchor: [15, 42]
          });

          const marker = L.marker([pump.lat, pump.lng], { icon: pumpIcon }).addTo(map);

          marker.bindPopup(`
            <div style="font-family: var(--font-sans); width: 220px;">
              <h4 style="margin:0 0 5px; color: var(--primary);">${pump.name}</h4>
              <p style="margin:0 0 3px; font-size:0.85rem;">${pump.address}</p>
              <p style="margin:0 0 3px; font-size:0.85rem;"><strong>Hours:</strong> ${pump.hours}</p>
              <p style="margin:0 0 3px; font-size:0.85rem;"><strong>CNG Price:</strong> ₹${pump.price.toFixed(2)}/kg</p>
              <p style="margin:0 0 3px; font-size:0.85rem;"><strong>Queue:</strong> ${pump.queue} vehicles</p>
              <p style="margin:0 0 8px; font-size:0.85rem;"><strong>Distance:</strong> ${dist} km</p>
              ${pump.available
              ? `<button onclick="bookPumpFromMap('${pump.name}')" class="btn" style="width:100%; padding:0.4rem; font-size:0.85rem;">🚗 Book Now</button>`
              : `<span class="badge no" style="width:100%; text-align:center;">CLOSED</span>`}
            </div>
          `);

          markersList.push(marker);
          pump.markerRef = marker;
        }

        // Render card
        const card = document.createElement("div");
        card.className = `pump-card ${activeCardId === pump.name ? 'selected' : ''}`;
        card.innerHTML = `
          <h4>${pump.name}</h4>
          <p><strong>Address:</strong> ${pump.address}</p>
          <p><strong>Price:</strong> ₹${pump.price.toFixed(2)}/kg | <strong>Hours:</strong> ${pump.hours}</p>
          <p><strong>Distance:</strong> ${dist} km</p>
          <div class="meta-row">
            <span class="badge ${pump.available ? 'yes' : 'no'}">${pump.available ? 'Available' : 'Unavailable'}</span>
            <span style="font-weight:bold; color: ${pump.queue > 10 ? '#dc3545' : 'var(--text-color)'};">Queue: ${pump.queue} vehicles</span>
          </div>
        `;

        card.addEventListener("click", () => {
          // De-select previous
          document.querySelectorAll(".pump-card").forEach(c => c.classList.remove("selected"));
          card.classList.add("selected");
          activeCardId = pump.name;

          map.setView([pump.lat, pump.lng], 14);

          // Open matching marker popup
          const targetMarker = markersList.find(m => {
            const latLng = m.getLatLng();
            return Math.abs(latLng.lat - pump.lat) < 0.0001 && Math.abs(latLng.lng - pump.lng) < 0.0001;
          });
          if (targetMarker) {
            targetMarker.openPopup();
          }
        });

        listContainer.appendChild(card);
      });
    }

    // Book pump click action from popup helper
    window.bookPumpFromMap = function (pumpName) {
      if (!window.CNG_DB) return;
      window.CNG_DB.setSelectedPump(pumpName);

      const user = window.CNG_DB.getLoggedInUser();
      if (user) {
        window.location.href = "booking.html";
      } else {
        window.showNotification("Login Required", "Please login or register to book a slot for " + pumpName + ".", () => {
          window.location.href = "login_register.html";
        });
      }
    };
  </script>
</body>

</html>
